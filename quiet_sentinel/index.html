<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>Quiet Sentinel · thegaf.nyc</title>
<style>
:root{color-scheme:dark;font:14px/1.5 'Titillium Web',system-ui,sans-serif;background:#09090c;color:#f4f4fa;--cyan:#59dcff;--pink:#ff66da;--muted:#9797a9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,#59dcff0b,transparent 55%),radial-gradient(ellipse at 90% 100%,#ff66da09,transparent 55%),#09090c}.shell{width:100%;max-width:560px}.console{width:100%;border:1px solid #ffffff20;border-radius:20px;background:#111116;box-shadow:0 24px 90px #0008;overflow:hidden}.brand{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #ffffff12}.signature{display:flex;flex-direction:column;align-items:center;gap:9px;width:fit-content;margin:22px auto 0;text-decoration:none;color:var(--muted);font-size:11px}.signature img{display:block;width:50px;height:50px;object-fit:contain}.signature:hover{color:var(--cyan)}.signature:focus-visible{outline:2px solid var(--pink);outline-offset:6px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}main{padding:22px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px;letter-spacing:-.05em;line-height:1.2;margin:4px 0}p{margin:5px 0;color:var(--muted);font-size:12px}.badge{font-size:11px;color:var(--cyan);border:1px solid #59dcff30;border-radius:99px;padding:5px 9px;white-space:nowrap}.badge::before{content:'●';margin-right:6px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}.metric{border:1px solid #ffffff12;border-radius:12px;background:#19191f;padding:14px 12px}.metric h2{font-size:11px;font-weight:500;letter-spacing:.1em;margin:0 0 10px;color:var(--muted)}.value{font-size:30px;font-weight:600;letter-spacing:-.06em;line-height:1}.unit{font-size:13px;margin-left:3px;color:var(--muted)}.bar{height:3px;background:#ffffff0d;border-radius:8px;margin-top:14px;overflow:hidden}.fill{height:100%;background:var(--cyan);width:0;transition:width .4s}.metric:nth-child(2) .fill{background:var(--pink)}.metric:nth-child(3) .fill{background:#aaa1ff}svg{width:100%;height:28px;display:block;margin-top:10px;color:var(--cyan)}.metric:nth-child(2) svg{color:var(--pink)}.metric:nth-child(3) svg{color:#aaa1ff}.age{font-size:10px;color:var(--muted);margin-top:6px}.feed-head{display:flex;justify-content:space-between;align-items:center}h2{font-size:12px;margin:0}.feed-head span{font-size:10px;color:var(--muted)}#alerts{max-height:215px;overflow:auto;margin-top:12px}.empty{padding:22px 12px;text-align:center;border:1px dashed #ffffff18;border-radius:10px;color:var(--muted);font-size:12px}.alert{border-left:2px solid var(--pink);padding:10px 12px;background:#ff66da08;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:12px;overflow-wrap:anywhere}.alert time{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.alert p{color:#ddd3df}footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #ffffff12;padding:13px 24px;font-size:10px;color:var(--muted)}button{font:inherit;font-size:11px;color:var(--cyan);border:1px solid #59dcff30;border-radius:7px;padding:6px 10px;background:transparent;cursor:pointer}button:hover{background:#59dcff12}button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.error{color:#ffc780;border-color:#ffc78055}@media(max-width:420px){body{padding:12px}.brand,footer{padding:14px 16px}main{padding:18px 16px}.metrics{gap:6px}.metric{padding:12px 8px}.value{font-size:26px}.eyebrow{font-size:9px}header{align-items:flex-start;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><section class="console" aria-label="Quiet Sentinel control panel"><header class="brand"><div><div class="eyebrow">Infrastructure, quietly observed.</div><h1>Quiet Sentinel<span style="color:var(--pink)">.</span></h1><p>GafCloud · CPU, memory & storage</p></div><div id="connection" class="badge" role="status">Connecting</div></header><main><div class="metrics"><section class="metric" id="cpu_percent" aria-label="CPU utilization"><h2>CPU</h2><span class="value">—</span><span class="unit">%</span><div class="bar"><div class="fill"></div></div><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="age">Awaiting sample</div></section><section class="metric" id="memory_percent" aria-label="RAM utilization"><h2>RAM</h2><span class="value">—</span><span class="unit">%</span><div class="bar"><div class="fill"></div></div><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="age">Awaiting sample</div></section><section class="metric" id="disk_percent" aria-label="DISK utilization"><h2>DISK</h2><span class="value">—</span><span class="unit">%</span><div class="bar"><div class="fill"></div></div><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="age">Awaiting sample</div></section></div><div class="feed-head"><h2>Alert history</h2><span id="alert-count">—</span></div><div id="alerts"><div class="empty">Waiting for the first update…</div></div></main><footer><span id="summary">Local monitoring · refreshes every 4s</span><button id="demo" title="Sends synthetic readings to a separate demo host">Test alert</button></footer></section><a class <script>
const $=id=>document.getElementById(id), metrics=['cpu_percent','memory_percent','disk_percent'];
let snapshot=null,busy=false,demoBusy=false;
function age(at){const seconds=Math.max(0,Math.floor((Date.now()-Date.parse(at))/1000));return Number.isFinite(seconds)?(seconds<60?seconds+'s ago':Math.floor(seconds/60)+'m ago'):'Time unavailable'}
function render(r){
 const events=r.events.filter(e=>e.host==='gafcloud');let fresh=0;
 for(const metric of metrics){const rows=events.filter(e=>e.metric===metric&&Number.isFinite(e.value)),last=rows.at(-1),el=$(metric);el.querySelector('.value').textContent=last?last.value.toFixed(1):'—';el.querySelector('.fill').style.width=last?Math.min(100,Math.max(0,last.value))+'%':'0';el.querySelector('.age').textContent=last?age(last.at):'Awaiting sample';if(last&&Date.now()-Date.parse(last.at)<90000)fresh++;const points=rows.map((e,i)=>(rows.length===1?50:i/(rows.length-1)*100)+','+(27-Math.min(100,Math.max(0,e.value))*.25)).join(' ');el.querySelector('polyline').setAttribute('points',points);}
 $('connection').textContent=fresh===3?'Live':fresh?'Partial data':'Awaiting data';$('connection').classList.toggle('error',fresh<3);
 $('summary').textContent=r.monitored_series+' series · '+r.events.length+' recent observations';
 $('alert-count').textContent=r.alerts.length+' recorded';const feed=$('alerts');feed.replaceChildren();if(!r.alerts.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='All quiet. No alerts recorded.';feed.append(empty)}
 for(const a of r.alerts){const div=document.createElement('article');div.className='alert';const time=document.createElement('time');time.textContent=(a.event?.host==='quiet-sentinel-demo'?'DEMO · ':'')+(a.event?.at?new Date(a.event.at).toLocaleString():'');div.append(time,document.createTextNode(a.message));if(a.ai_assessment){const p=document.createElement('p');p.textContent=a.ai_assessment;div.append(p)}feed.append(div)}
}
async function refresh(){if(busy)return;busy=true;try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!response.ok)throw Error('State unavailable');const r=await response.json();if(!Array.isArray(r.events)||!Array.isArray(r.alerts))throw Error('Invalid state');snapshot=r;render(r)}catch(e){$('connection').textContent='Disconnected';$('connection').classList.add('error');$('summary').textContent='Cannot reach monitor · retrying every 4s';for(const metric of metrics)$(metric).querySelector('.age').textContent='Last known reading'}finally{busy=false}}
$('demo').onclick=async()=>{if(demoBusy)return;demoBusy=true;const button=$('demo');button.disabled=true;button.textContent='Sending…';try{for(const value of [22,23,24,22,23,24,22,23,97]){const r=await fetch('/api/observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:'quiet-sentinel-demo',metric:'cpu_percent',value}),signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Demo failed')}button.textContent='Test sent';await refresh()}catch(e){button.textContent='Test failed — retry'}finally{demoBusy=false;button.disabled=false}};
refresh();setInterval(refresh,4000);
</script></body></html>
